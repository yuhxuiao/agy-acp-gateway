# Managed manually (agy-acp-gateway admin page). Not created by the 1Panel proxy UI.
# Admin dashboard of the agy ACP gateway, protected by the gateway itself (Basic auth, password = API key).
location = /acp {
    return 301 /acp/;
}
location ^~ /acp/ {
    proxy_pass http://127.0.0.1:18891/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_buffering off;
    add_header Cache-Control no-cache;
    add_header X-Robots-Tag "noindex, nofollow";
}

services:
  agy-acp-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: agy-acp-gateway:local
    container_name: agy-acp-gateway
    restart: unless-stopped
    stop_grace_period: 25s
    env_file: .env
    environment:
      # v2.3.26 dual-layer memory governance:
      # - AGY_GLOBAL_IDLE_TARGET: steady-state hot workers kept when idle (default 8; hibernated sessions resume via session/resume with KV cache intact).
      # - AGY_GLOBAL_BURST_MAX_LIVE_WORKERS: hard cross-account burst ceiling (0 = auto-derived from container mem_limit: 8 on 3200m, 18 on 6 GB).
      # - Child account gateways run in thin mode (~80 MiB GOMEMLIMIT each); raise mem_limit (e.g. 6144m) for higher multi-account burst concurrency.
      AGY_LISTEN_HOST: "0.0.0.0"
      AGY_MAX_LIVE_WORKERS: "${AGY_MAX_LIVE_WORKERS:-8}"
      AGY_GLOBAL_MAX_LIVE_WORKERS: "${AGY_GLOBAL_MAX_LIVE_WORKERS:-8}"
      AGY_GLOBAL_IDLE_TARGET: "${AGY_GLOBAL_IDLE_TARGET:-8}"
      AGY_GLOBAL_BURST_MAX_LIVE_WORKERS: "${AGY_GLOBAL_BURST_MAX_LIVE_WORKERS:-0}"
      AGY_IDLE_WORKER_TTL_SEC: "${AGY_IDLE_WORKER_TTL_SEC:-180}"
      AGY_CONV_KEEP_DAYS: "${AGY_CONV_KEEP_DAYS:-4}"
      AGY_ACP_LOG_KEEP_DAYS: "${AGY_ACP_LOG_KEEP_DAYS:-7}"
    volumes:
      - ./data:/data
    ports:
      # loopback only: 18890 for local debugging, 18891 for the OpenResty /acp/ reverse proxy
      - "127.0.0.1:18890:18890"
      - "127.0.0.1:18891:18891"
    mem_limit: 3200m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
